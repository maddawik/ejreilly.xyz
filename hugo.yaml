baseURL: "https://ejreilly.xyz/"
title: ejreilly.xyz
paginate: 5
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

# googleAnalytics: UA-123-45

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: ejreilly.xyz
  description: "come drink the kool-aid"
  keywords: [Blog, Portfolio, Resume]
  author: EJ Reilly
  # author: ["Me", "You"] # multiple authors
  # images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.ico"
    favicon32x32: "/favicon-32x32.ico"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/favicon.ico"

  label:
    text: "./ejreilly.xyz"
    icon: https://s3.amazonaws.com/keybase_processed_uploads/a0cd7c3711b1ec79a753138dfa0c6305_360_360.jpg
    iconHeight: 35

  # profile-mode
  profileMode:
    enabled: true # needs to be explicitly set
    title: EJ Reilly
    subtitle: "Hi 👋 I'm EJ. I'm a programmer and devops engineer."
    imageUrl: "https://gravatar.com/userimage/39490228/046111672ebc34d81a5c840c7b0292e2.jpeg?size=300"
    imageWidth: 200
    imageHeight: 200
    imageTitle: Me with a guitar
    buttons:
      - name: Resume
        url: resume
      - name: Blog
        url: posts

  # home-info mode
  homeInfoParams:
    Title: "EJ"
    Content: devops engineer // programmer

  socialIcons:
    - name: github
      url: "https://github.com/mawdac"
    - name: keybase
      url: "https://keybase.io/maddawik"
    - name: linkedin
      url: "https://linkedin.com/in/ej-reilly/"
    - name: rss
      url: "https://ejreilly.xyz/index.xml"

  analytics:
    google:
      SiteVerificationTag: "XYZabc"
    bing:
      SiteVerificationTag: "XYZabc"
    yandex:
      SiteVerificationTag: "XYZabc"

  cover:
    hidden: false # hide everywhere but not in structured data
    hiddenInList: false # hide on list pages and home
    hiddenInSingle: false # hide on single page

  # editPost:
  # URL: "https://github.com/mawdac/blog/content"
  # Text: "Suggest Changes" # edit text
  # appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]
menu:
  main:
    - identifier: resume
      name: Resume
      url: /resume/
      weight: 1
    - identifier: posts
      name: Blog
      url: /posts/
      weight: 2
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 3
    # - identifier: example
    #   name: example.org
    #   url: https://example.org
    #   weight: 20
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    style: catppuccin-mocha
